name: release

# Builds the binary so hosts do not have to. Compiling on the target costs a
# Rust toolchain, ~2.2 GB of peak memory and a build directory on every machine
# that runs this -- see "Known limits" in the README.
#
# Every push to main is built, with no paths-ignore filter. That is deliberate:
# the updater installs a prebuilt binary only when the release manifest records
# the exact commit it is trying to install, so a docs-only commit that skipped
# CI would silently push every host back to compiling from source.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Release numbers are YY.MM.Build: the calendar year and month, then a counter
  # that restarts each month. The counter cannot live in the tree -- two commits
  # would race to claim the same number -- so it is derived here from the tags
  # already published, and every build gets one.
  version:
    name: assign release number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ '${{ github.ref_type }}' = tag ]; then
            # A tag pushed by hand names its own release; honour it verbatim
            # rather than inventing a number that disagrees with the tag.
            VERSION='${{ github.ref_name }}'
            VERSION=${VERSION#v}
          else
            # %-m, not %m: the scheme is 26.8.1, not 26.08.1.
            SERIES=$(date -u +%y.%-m)
            SERIES_RE=$(printf '%s' "$SERIES" | sed 's/\./\\./g')
            REFS=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$SERIES." \
                     --jq '.[].ref' 2>/dev/null || true)
            # The highest number already used this month, not how many there are:
            # a deleted tag must never hand its number to a different commit.
            LAST=$(printf '%s\n' "$REFS" \
                   | sed -n "s|^refs/tags/v$SERIES_RE\.\([0-9][0-9]*\)$|\1|p" \
                   | sort -n | tail -1)
            VERSION="$SERIES.$(( ${LAST:-0} + 1 ))"
          fi
          echo "assigned $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }} / ${{ matrix.family }}
    needs: version
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built against the oldest glibc each family needs to support; glibc
          # is backward compatible, so these run on anything newer. Arch has no
          # entry of its own -- its glibc is newer than both, so it takes the
          # rhel artifact (see host_family in bootstrap.sh).
          - { arch: x86_64,  family: debian, runner: ubuntu-latest,    image: 'ubuntu:22.04' }
          - { arch: x86_64,  family: rhel,   runner: ubuntu-latest,    image: 'rockylinux/rockylinux:9' }
          - { arch: aarch64, family: debian, runner: ubuntu-24.04-arm, image: 'ubuntu:22.04' }
          - { arch: aarch64, family: rhel,   runner: ubuntu-24.04-arm, image: 'rockylinux/rockylinux:9' }
    steps:
      # Before checkout: actions/checkout needs git, and these base images do
      # not ship it.
      - name: install build dependencies
        run: |
          set -eux
          if command -v dnf >/dev/null 2>&1; then
            # Not curl: this image ships curl-minimal, which conflicts with the
            # curl package and fails the whole transaction. It already provides
            # the binary, so only reach for curl if there is none at all.
            dnf install -y gcc glibc-devel make tar git pam findutils
            command -v curl >/dev/null 2>&1 || dnf install -y --allowerasing curl
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            # libc6-dev explicitly: with --no-install-recommends, gcc arrives
            # without it, and the link fails on missing crt1.o/crti.o/libc.
            apt-get install -y --no-install-recommends \
              gcc libc6-dev make curl ca-certificates tar git libpam0g
          fi

      - uses: actions/checkout@v7

      - name: record provenance for build.rs
        # A CI checkout may have no usable git metadata, and build.rs falls back
        # to this file. Without it the binary could not report which commit it
        # is and the update check would have nothing to compare.
        run: |
          set -eux
          if [ "${{ github.ref_type }}" = tag ]; then REF='${{ github.ref_name }}'; else REF=main; fi
          printf 'repo=%s\nref=%s\ncommit=%s\nversion=%s\n' \
            '${{ github.repository }}' "$REF" '${{ github.sha }}' \
            '${{ needs.version.outputs.version }}' > .wd-source
          cat .wd-source

      - name: install rust and build
        run: |
          set -eux
          curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          # Deliberately not $GITHUB_PATH. The runner rebuilds PATH for later
          # steps from the image's declared PATH plus what it is given, and the
          # Rocky image declares none -- so appending there left PATH as just
          # the cargo directory and the next step could not find `sh` itself.
          # The ubuntu image declares one, which is why only rhel broke.
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          cargo build --release
          # Confirm we linked against PAM the way build.rs intended, rather
          # than silently producing something that cannot authenticate.
          ldd target/release/webdesk | grep -q libpam.so.0

      - name: stage
        run: |
          set -eux
          mkdir -p dist
          cp target/release/webdesk \
             "dist/webdesk-${{ matrix.arch }}-${{ matrix.family }}"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: webdesk-${{ matrix.arch }}-${{ matrix.family }}
          path: dist/webdesk-${{ matrix.arch }}-${{ matrix.family }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload to it
      id-token: write      # sign the provenance attestation
      attestations: write  # record it
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums and manifest
        run: |
          set -eux
          cd dist
          sha256sum webdesk-* > SHA256SUMS
          cat SHA256SUMS
          # The updater reads this first: it installs a prebuilt binary only if
          # this commit is the one it was about to build.
          if [ "${{ github.ref_type }}" = tag ]; then REF='${{ github.ref_name }}'; else REF=main; fi
          cat > manifest.json <<EOF
          {
            "repo": "${{ github.repository }}",
            "ref": "$REF",
            "commit": "${{ github.sha }}",
            "version": "${{ needs.version.outputs.version }}",
            "tag": "${{ needs.version.outputs.tag }}",
            "run": "${{ github.run_id }}",
            "assets": [
              "webdesk-x86_64-debian",
              "webdesk-x86_64-rhel",
              "webdesk-aarch64-debian",
              "webdesk-aarch64-rhel"
            ]
          }
          EOF
          cat manifest.json

      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/webdesk-*'

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout -- it only needs the built artifacts --
          # so gh has no git remote to infer the repository from and exits
          # with "not a git repository". Naming it here is cheaper than
          # cloning the tree just to tell gh where to publish.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          VERSION='${{ needs.version.outputs.version }}'
          TAG='${{ needs.version.outputs.tag }}'
          SHA='${{ github.sha }}'

          # manifest.json last, always. A host reads it first and installs a
          # prebuilt binary only when it names the commit it was about to
          # build, so publishing it after everything else makes it the commit
          # point of the whole release: by the time a host can see a new
          # manifest, the binaries beside it are already the new ones.
          publish_assets() {
            gh release upload "$1" dist/webdesk-* dist/SHA256SUMS --clobber
            gh release upload "$1" dist/manifest.json --clobber
            # Editing a release in place is what keeps latest-main's download
            # URLs alive, but it means --clobber only replaces names that are
            # already there. An asset renamed or dropped between builds would
            # otherwise sit on the pointer for ever, beside the one that
            # replaced it -- as the whole previous set of linuxwebdesk-* names
            # did the moment the binary was renamed. Remove anything this build
            # did not just publish, so the release holds exactly one build.
            for a in $(gh release view "$1" --json assets --jq '.assets[].name'); do
              [ -e "dist/$a" ] || {
                echo "removing stale asset $a from $1"
                gh release delete-asset "$1" "$a" --yes
              }
            done
          }

          # The numbered release: immutable, and the permanent record of what
          # this version actually was. Cut even for an ordinary push to main,
          # because the release number is what a host reports and every support
          # question starts there.
          #
          # Creating this tag does not start another run of this workflow.
          # GitHub suppresses workflow triggers for refs pushed with the default
          # GITHUB_TOKEN, and that is the only reason the `tags: v*` trigger at
          # the top of this file is not an infinite loop.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it"
          else
            gh release create "$TAG" --target "$SHA" --title "$VERSION" --generate-notes
          fi
          publish_assets "$TAG"

          # Hosts that track a branch install from the rolling pointer, not from
          # the numbered release, so it has to carry the same assets. A build of
          # a hand-pushed tag leaves it alone: a tag is not the head of main and
          # must not be advertised as it.
          if [ '${{ github.ref_type }}' != tag ]; then
            NOTES=$(printf '%s\n' \
              "Rebuilt on every push to main. This build is $VERSION, archived permanently as $TAG." \
              "" \
              "Installed automatically by \`webdesk-update\` when it matches the commit being installed; otherwise the host falls back to compiling from source." \
              "" \
              "Verify provenance with:" \
              "" \
              "    gh attestation verify webdesk-x86_64-rhel --repo $GH_REPO")

            if gh release view latest-main >/dev/null 2>&1; then
              # Move the tag and edit the release in place, rather than deleting
              # it and making it again. Deleting takes the download URLs with
              # it, and the CDN in front of those paths can go on serving the
              # previous manifest.json for a minute or so afterwards -- which is
              # precisely how a host ends up compiling a build it could have
              # downloaded. Editing never invalidates the path, so there is no
              # window in which it points at nothing.
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-main" \
                -f sha="$SHA" -F force=true >/dev/null
              gh release edit latest-main \
                --prerelease \
                --title "Latest build of main ($VERSION)" \
                --notes "$NOTES"
            else
              gh release create latest-main \
                --prerelease \
                --target "$SHA" \
                --title "Latest build of main ($VERSION)" \
                --notes "$NOTES"
            fi
            publish_assets latest-main
          fi
