[package]
name = "webdesk"
# Release numbers are YY.MM.Build and are assigned by CI, which knows how many
# releases this month already exist. This value is only the floor a local or
# from-source build reports when no CI number was stamped in -- see build.rs.
version = "26.8.1"
edition = "2021"
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
# The reverse proxy that puts a container app on this origin. Both crates are
# already in the tree as axum's own dependencies; these lines only turn on the
# client half, so proxying brings in no new third-party code. Note the absence
# of any TLS feature -- the proxy only ever dials 127.0.0.1, which is the same
# reason update.rs borrows curl rather than linking a TLS stack.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "process", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
libc = "0.2"
futures-util = "=0.3.31"
rand = "0.8"
nix = { version = "0.29", features = ["user", "process", "fs", "term", "socket", "poll", "signal", "hostname"] }
portable-pty = "0.8"
users = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
