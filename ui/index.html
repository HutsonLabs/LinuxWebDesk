<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Desk</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/gibson-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/gibson.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1>Web Desk</h1>
    <p class="login-sub">Sign in with your system account</p>
    <label>Username<input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="login-btn">Sign in</button>
    <p id="login-err" class="login-err" role="alert"></p>
  </form>
</div>

<div id="desktop" class="desktop" hidden>
  <div id="windows" class="windows"></div>

  <!-- A dock, not a panel: it floats clear of the desktop, is only as wide as
       what is in it, and every item is its own button. It is applications and
       open windows now, and nothing else. -->
  <div class="dock-layer">
    <div class="dock-scroll">
      <div class="dock" role="toolbar" aria-label="Applications">
        <button type="button" class="dock-btn tip tip--up" data-app="files" data-tip="Files" aria-label="Files">
          <svg class="ic-d" aria-hidden="true"><use href="#a-files"></use></svg>
          <span class="dock-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="dock-btn tip tip--up" data-app="terminal" data-tip="Terminal" aria-label="Terminal">
          <svg class="ic-d" aria-hidden="true"><use href="#a-terminal"></use></svg>
          <span class="dock-dot" aria-hidden="true"></span>
        </button>

        <!-- Open windows that are not one of the apps above -- editors -- get
             their own dock item, with the file's own icon. -->
        <div id="tasks" class="dock-tasks"></div>
      </div>
    </div>

    <!-- The account rides in the dock band, at the far right. It used to sit
         in the top-left corner of the desktop, where windows covered it; the
         band is the one strip windows cannot have -- they open clear of it,
         no title bar can be dragged into it and no snap region reaches it --
         so it is always there to be clicked. Its menu opens upwards. -->
    <div class="account">
      <button type="button" id="whoami" class="account-btn tip tip--up" data-tip=""
              aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu">
        <svg class="ic-d" aria-hidden="true"><use href="#a-user"></use></svg>
        <span class="dock-dot" aria-hidden="true"></span>
      </button>

      <div id="user-menu" class="menu" role="menu" aria-label="Account" hidden>
        <button type="button" class="menu-row" role="menuitem" data-a="system">
          <svg class="ic-a" aria-hidden="true"><use href="#a-user"></use></svg>
          <span class="menu-text">
            <span class="menu-name" data-el="who"></span>
            <span class="menu-sub">System — build and updates</span>
          </span>
        </button>
        <div class="menu-sep" role="none"></div>
        <button type="button" class="menu-row" role="menuitem" data-a="logout">
          <svg class="ic-a" aria-hidden="true"><use href="#a-signout"></use></svg>
          <span class="menu-label">Sign out</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
