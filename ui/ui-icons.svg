<!-- term.hut is first-party, so its mark comes from its own site repository
     rather than from Simple Icons: the prompt chevron and the cursor rule,
     at
     github.com/HutsonLabs/termhut.hutsonlabs.com/blob/main/site/assets/icon-full.svg
     The source draws it on a dark tile in its own orange; here the tile is
     dropped and the colour comes from currentColor, like every other icon.
     It is stroked upstream, which is lucky: unlike the brand marks below it
     draws as line rather than as a solid shape. The geometry is the
     original's, scaled off its 64 grid onto this one. The weights are set per
     element instead of on the group: 5 on the chevron, 3 on the cursor rule,
     which the .679 scale renders as 3.4 and 2.0. Heavier than the 1.5 hairline
     the rest of the file carries, so the mark reads at dock size. -->
<symbol id="a-termhut" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" transform="translate(2.5 3.85) scale(.679)"> <polyline points="0,0 14,12 0,24" stroke-width="5" /> <line x1="18" y1="23.5" x2="28" y2="23.5" stroke-width="3" /> </g></symbol>
<symbol id="a-external" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"> <path d="M14 4h6v6m0-6l-8.5 8.5" /> <path d="M19 14.5V17c0 1.89 0 2.83-.59 3.41S16.89 21 15 21H7c-1.89 0-2.83 0-3.41-.59S3 18.89 3 17V9c0-1.89 0-2.83.59-3.41S5.11 5 7 5h2.5" /> </g></symbol>
<!-- Application marks, from simpleicons.org (CC0 1.0). Solid glyphs rather
     than hairline strokes, because that is what a brand mark is. They are kept
     on the same 24 grid, drawn in currentColor like everything else, and scaled
     a little under full size so their optical weight sits beside the stroked
     icons instead of shouting over them. Brand colours are deliberately not
     used: an icon here takes the colour of the control it is in.
     Regenerated by scripts/brand-icons.py. -->
